{% load blog_tags %}
<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آخرین پست‌ها</title>
    <style>
        /* استایل کلی بخش */
        .latest-posts {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            margin: 40px auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
        }

        /* استایل تیتر */
        .latest-posts h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 4px solid #4f46e5;
            display: inline-block;
            letter-spacing: -0.5px;
            position: relative;
        }

        /* افکت زیرخط تیتر */
        .latest-posts h2::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 60%;
            height: 4px;
            background: #818cf8;
            border-radius: 4px;
        }

        /* استایل هر لینک (پست) */
        .latest-posts a {
            display: block;
            padding: 14px 18px;
            margin-bottom: 8px;
            color: #1e293b;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 10px;
            background: #f8fafc;
            transition: all 0.25s ease;
            border-right: 4px solid transparent;
            position: relative;
            padding-right: 44px;
        }

        /* آیکون شماره‌دار قبل از هر لینک */
        .latest-posts a::before {
            content: "📄";
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.7;
        }

        /* هاور لینک‌ها */
        .latest-posts a:hover {
            background: #eef2ff;
            border-right-color: #4f46e5;
            transform: translateX(-6px);
            color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        /* مخفی کردن برچسب‌های <br> */
        .latest-posts br {
            display: none;
        }

        /* استایل برای لینک آخر (حذف margin-bottom) */
        .latest-posts a:last-child {
            margin-bottom: 0;
        }

        /* استایل برای نمایش تعداد پست‌ها (اختیاری) */
        .latest-posts .post-count {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            margin-right: 10px;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 600px) {
            .latest-posts {
                padding: 18px 16px;
                margin: 20px 12px;
            }

            .latest-posts h2 {
                font-size: 20px;
            }

            .latest-posts a {
                font-size: 14px;
                padding: 12px 14px;
                padding-right: 40px;
            }

            .latest-posts a::before {
                font-size: 16px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="latest-posts">
        <h2>
            📝 آخرین پست‌ها
            <span class="post-count">{% cp %}</span>{/\}
        </h2>

        {% for post in l_post %}
            <a href="{{ post.get_absolute_url }}">
                {{ post.title }}
            </a>
        {% empty %}
            <p style="color: #94a3b8; text-align: center; padding: 20px 0;">
                😕 هنوز پستی منتشر نشده است.
            </p>
        {% endfor %}

    </div>

</body>
</html>
